# Mori has no Go module dependencies (see AGENTS.md); only CI actions are
# tracked.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    commit-message:
      prefix: "[chore] : "
    groups:
      actions:
        patterns:
          - "*"
