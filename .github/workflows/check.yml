# Mori CI runs the same gate contract as local `make ci`, split into jobs so
# failures are attributable:
#   static  fmt, go fix -diff, vet, golangci-lint, build, cross, deps, tidy
#   test    full suite (CGO_ENABLED=0) plus the 386 execution run
#   race    full suite under the race detector (the cgo exception)
#   fuzz    short fuzz smoke of every fuzz target
#   aggregate  required check: every job above succeeded on this revision.
name: Checks

on:
  pull_request:
  push:
    branches:
      - main

# This workflow runs for not-yet-reviewed external contributions and so it
# intentionally has no write access and only limited read access to the
# repository.
permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
  GOWORK: "off"
  GOFLAGS: -mod=readonly
  GO_VERSION: "1.27.1"
  GOLANGCI_LINT_VERSION: v2.13.2

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install golangci-lint built with the pinned Go toolchain
        run: GOFLAGS= go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      - name: Static gates
        run: make check tidy-check

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Tests
        run: make test
      - name: Tests on 386
        run: GOARCH=386 go test -count=1 ./...

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Race detector
        run: make race

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Fuzz smoke
        run: make fuzz-smoke FUZZ_TIME=20s

  aggregate:
    if: always()
    needs: [static, test, race, fuzz]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a required job finished with: $r"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
